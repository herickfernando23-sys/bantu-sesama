  <line class="grid" x1="60" y1="994" x2="1740" y2="994"/>
  <line class="grid" x1="60" y1="1050" x2="1740" y2="1050"/>
  <line class="grid" x1="60" y1="1080" x2="1740" y2="1080"/>

  <text class="txt-head" x="90" y="245">ID</text>
  <text class="txt-head" x="175" y="245">Skenario UAT</text>
  <text class="txt-head" x="475" y="245">Langkah Uji Singkat</text>
  <text class="txt-head" x="835" y="245">Hasil yang Diharapkan</text>
  <text class="txt-head" x="1230" y="245">Status</text>
  <text class="txt-head" x="1320" y="245">Bukti</text>

  <!-- Row helper y centers: 301,357,413,469,525,581,637,693,749,805,861,917,973,1029 -->
  <text class="txt-cell" x="84" y="301">UAT-01</text>
  <text class="txt-cell" x="175" y="301">Lihat daftar kampanye</text>
  <text class="txt-cell" x="475" y="301">Buka halaman beranda</text>
  <text class="txt-cell" x="835" y="301">Daftar kampanye tampil</text>
  <rect x="1220" y="283" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="300">PASS</text>
  <text class="txt-cell" x="1320" y="301">01-home-page.png</text>

  <text class="txt-cell" x="84" y="357">UAT-02</text>
  <text class="txt-cell" x="175" y="357">Lihat detail kampanye</text>
  <text class="txt-cell" x="475" y="357">Pilih salah satu kampanye</text>
  <text class="txt-cell" x="835" y="357">Detail kampanye tampil</text>
  <rect x="1220" y="339" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="356">PASS</text>
  <text class="txt-cell" x="1320" y="357">02-campaign-detail.png</text>

  <text class="txt-cell" x="84" y="413">UAT-03</text>
  <text class="txt-cell" x="175" y="413">Lihat transparansi dana</text>
  <text class="txt-cell" x="475" y="413">Buka tab transparansi</text>
  <text class="txt-cell" x="835" y="413">Grafik alokasi dan pencairan</text>
  <rect x="1220" y="395" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="412">PASS</text>
  <text class="txt-cell" x="1320" y="413">03-transparency-tab.png</text>

  <text class="txt-cell" x="84" y="469">UAT-04</text>
  <text class="txt-cell" x="175" y="469">Buat donasi baru</text>
  <text class="txt-cell" x="475" y="469">Isi identitas dan nominal</text>
  <text class="txt-cell" x="835" y="469">Masuk ke payment gateway</text>
  <rect x="1220" y="451" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="468">PASS</text>
  <text class="txt-cell" x="1320" y="469">04-05-06 screenshots</text>

  <text class="txt-cell" x="84" y="525">UAT-05</text>
  <text class="txt-cell" x="175" y="525">Pembayaran sukses</text>
  <text class="txt-cell" x="475" y="525">Selesaikan transaksi</text>
  <text class="txt-cell" x="835" y="525">Status sukses dan dana bertambah</text>
  <rect x="1220" y="507" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="524">PASS</text>
  <text class="txt-cell" x="1320" y="525">07-payment-success-or-pending.png</text>

  <text class="txt-cell" x="84" y="581">UAT-06</text>
  <text class="txt-cell" x="175" y="581">Pembayaran pending</text>
  <text class="txt-cell" x="475" y="581">Cek status pembayaran</text>
  <text class="txt-cell" x="835" y="581">Status pending dapat dilanjutkan</text>
