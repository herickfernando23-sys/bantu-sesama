  <text class="txt-cell" x="835" y="637">Donasi terbaru muncul paling atas</text>
  <rect x="1220" y="619" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="636">PASS</text>
  <text class="txt-cell" x="1320" y="637">08-donasi-saya-history.png</text>

