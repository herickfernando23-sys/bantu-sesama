  <text class="txt-cell" x="175" y="693">Setup donasi rutin</text>
  <text class="txt-cell" x="475" y="693">Aktifkan recurring</text>
  <text class="txt-cell" x="835" y="693">Recurring record berhasil dibuat</text>
  <rect x="1220" y="675" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="692">PASS</text>
  <text class="txt-cell" x="1320" y="693">11-recurring-setup.png</text>

  <text class="txt-cell" x="84" y="749">UAT-09</text>
  <text class="txt-cell" x="175" y="749">List recurring donation</text>
  <text class="txt-cell" x="475" y="749">Buka list recurring user</text>
  <text class="txt-cell" x="835" y="749">Data recurring tampil</text>
  <rect x="1220" y="731" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="748">PASS</text>
  <text class="txt-cell" x="1320" y="749">12-recurring-management.png</text>

  <text class="txt-cell" x="84" y="805">UAT-10</text>
  <text class="txt-cell" x="175" y="805">Cancel recurring donation</text>
  <text class="txt-cell" x="475" y="805">Klik batalkan recurring</text>
  <text class="txt-cell" x="835" y="805">Status recurring non-aktif</text>
  <rect x="1220" y="787" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="804">PASS</text>
  <text class="txt-cell" x="1320" y="805">12-recurring-management.png</text>

  <text class="txt-cell" x="84" y="861">UAT-11</text>
  <text class="txt-cell" x="175" y="861">Chatbot FAQ</text>
  <text class="txt-cell" x="475" y="861">Input: "cara donasi"</text>
  <text class="txt-cell" x="835" y="861">Bot menjawab sesuai FAQ</text>
  <rect x="1220" y="843" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="860">PASS</text>
  <text class="txt-cell" x="1320" y="861">10-chatbot-feature.png</text>

  <text class="txt-cell" x="84" y="917">UAT-12</text>
  <text class="txt-cell" x="175" y="917">Chatbot NLP</text>
  <text class="txt-cell" x="475" y="917">Pertanyaan bebas user</text>
  <text class="txt-cell" x="835" y="917">Jawaban AI/fallback KB</text>
  <rect x="1220" y="899" width="88" height="24" rx="12" class="badge-blocked"/><text class="txt-badge" x="1230" y="916">BLOCKED</text>
  <text class="txt-cell" x="1320" y="917">(Isi saat API key aktif)</text>

  <text class="txt-cell" x="84" y="973">UAT-13</text>
  <text class="txt-cell" x="175" y="973">Admin dashboard</text>
  <text class="txt-cell" x="475" y="973">Login sebagai admin</text>
  <text class="txt-cell" x="835" y="973">Monitoring dan verifikasi tampil</text>
  <rect x="1220" y="955" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="972">PASS</text>
  <text class="txt-cell" x="1320" y="973">09-admin-dashboard.png</text>

  <text class="txt-cell" x="84" y="1029">UAT-14</text>
  <text class="txt-cell" x="175" y="1029">Keamanan endpoint auth</text>
  <text class="txt-cell" x="475" y="1029">Akses tanpa token</text>
  <text class="txt-cell" x="835" y="1029">Response 401/403</text>
  <rect x="1220" y="1011" width="64" height="24" rx="12" class="badge-pass"/><text class="txt-badge" x="1234" y="1028">PASS</text>
  <text class="txt-cell" x="1320" y="1029">API response / Postman</text>

  <text class="txt-small" x="80" y="1135">Catatan: Status dapat diubah sesuai hasil uji aktual. Template ini disusun untuk kebutuhan laporan UAS.</text>
