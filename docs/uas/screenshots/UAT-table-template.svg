<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Tabel UAT BantuSesama</title>
  <desc id="desc">Template tabel User Acceptance Test untuk laporan UAS.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .header { fill: #0f172a; }
      .headcell { fill: #1e293b; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .txt-title { font: 700 40px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .txt-sub { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .txt-head { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .txt-cell { font: 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .txt-small { font: 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .pass { fill: #ecfdf3; }
      .fail { fill: #fef2f2; }
      .blocked { fill: #fffbeb; }
      .badge-pass { fill: #16a34a; }
      .badge-fail { fill: #dc2626; }
      .badge-blocked { fill: #d97706; }
      .txt-badge { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1260"/>
  <rect class="card" x="40" y="40" width="1720" height="1180" rx="16"/>

  <rect class="header" x="40" y="40" width="1720" height="140" rx="16"/>
  <text class="txt-title" x="80" y="105">Dokumentasi UAT - BantuSesama</text>
  <text class="txt-sub" x="80" y="145">User Acceptance Test (Template Hasil Pengujian)</text>

  <!-- Table layout -->
  <!-- x positions: 60, 150, 460, 820, 1210, 1300, 1740 -->
  <rect class="headcell" x="60" y="210" width="1680" height="56" rx="8"/>
  <line class="grid" x1="150" y1="210" x2="150" y2="1080"/>
  <line class="grid" x1="460" y1="210" x2="460" y2="1080"/>
  <line class="grid" x1="820" y1="210" x2="820" y2="1080"/>
  <line class="grid" x1="1210" y1="210" x2="1210" y2="1080"/>
  <line class="grid" x1="1300" y1="210" x2="1300" y2="1080"/>
  <line class="grid" x1="1740" y1="210" x2="1740" y2="1080"/>

  <line class="grid" x1="60" y1="266" x2="1740" y2="266"/>
  <line class="grid" x1="60" y1="322" x2="1740" y2="322"/>
  <line class="grid" x1="60" y1="378" x2="1740" y2="378"/>
  <line class="grid" x1="60" y1="434" x2="1740" y2="434"/>
  <line class="grid" x1="60" y1="490" x2="1740" y2="490"/>
  <line class="grid" x1="60" y1="546" x2="1740" y2="546"/>
  <line class="grid" x1="60" y1="602" x2="1740" y2="602"/>
  <line class="grid" x1="60" y1="658" x2="1740" y2="658"/>
  <line class="grid" x1="60" y1="714" x2="1740" y2="714"/>
  <line class="grid" x1="60" y1="770" x2="1740" y2="770"/>
  <line class="grid" x1="60" y1="826" x2="1740" y2="826"/>
  <line class="grid" x1="60" y1="882" x2="1740" y2="882"/>
